server:
  port: ${PORT:${SERVER_PORT:8080}}
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

spring:
  application:
    name: kalasathi-server
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/kalasathi_db}
    username: ${DB_USERNAME:kalasathi}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      leak-detection-threshold: 2000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  task:
    scheduling:
      pool:
        size: 2

app:
  cache:
    default-ttl-minutes: ${CACHE_TTL_MINUTES:10}
  rate-limit:
    auth:
      max-requests: ${AUTH_RATE_LIMIT_MAX_REQUESTS:10}
      window-minutes: ${AUTH_RATE_LIMIT_WINDOW_MINUTES:15}
  security:
    jwt-secret: ${JWT_SECRET:}
    jwt-expiry-minutes: ${JWT_EXPIRY_MINUTES:1440}
  cors:
    origin: ${CORS_ORIGIN:http://localhost:5173}
  storage:
    aws-region: ${AWS_REGION:ap-south-1}
    s3:
      bucket: ${S3_BUCKET:}
      endpoint: ${S3_ENDPOINT_URL:}
  image-enhancement:
    url: ${IMAGE_ENHANCEMENT_URL:}
    api-key: ${IMAGE_ENHANCEMENT_API_KEY:}
  image-processing:
    poll-interval-ms: ${IMAGE_PROCESSING_POLL_INTERVAL_MS:1000}
  razorpay:
    payment-mode: ${PAYMENT_MODE:sandbox}
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
