name: Test and build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run Spring tests
        env:
          JWT_SECRET: ci-only-test-secret-not-for-production-32bytes
        run: mvn -B -f server/pom.xml test

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Run frontend tests
        run: npm run test:ui --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Verify API Docker build
        run: docker build -f server/Dockerfile -t kalasathi-api:test .
