name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

  deploy-backend:
    name: Deploy backend to ECS
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --pull -f backend/Dockerfile -t "$ECR_REPOSITORY_URI:$IMAGE_TAG" backend
          docker push "$ECR_REPOSITORY_URI:$IMAGE_TAG"

      - name: Prepare ECS task definition
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          EXECUTION_ROLE_ARN: ${{ vars.ECS_TASK_EXECUTION_ROLE_ARN }}
          TASK_ROLE_ARN: ${{ vars.ECS_TASK_ROLE_ARN }}
          DATABASE_URL_SECRET_ARN: ${{ vars.DATABASE_URL_SECRET_ARN }}
          JWT_SECRET_ARN: ${{ vars.JWT_SECRET_ARN }}
          CORS_ORIGINS_JSON: ${{ vars.CORS_ORIGINS_JSON }}
          EFS_FILE_SYSTEM_ID: ${{ vars.EFS_FILE_SYSTEM_ID }}
          EFS_ACCESS_POINT_ID: ${{ vars.EFS_ACCESS_POINT_ID }}
        run: |
          jq \
            --arg region "$AWS_REGION" \
            --arg execution_role "$EXECUTION_ROLE_ARN" \
            --arg task_role "$TASK_ROLE_ARN" \
            --arg database_secret "$DATABASE_URL_SECRET_ARN" \
            --arg jwt_secret "$JWT_SECRET_ARN" \
            --arg cors_origins "$CORS_ORIGINS_JSON" \
            --arg efs_id "$EFS_FILE_SYSTEM_ID" \
            --arg efs_access_point "$EFS_ACCESS_POINT_ID" \
            '(.executionRoleArn = $execution_role)
             | (.taskRoleArn = $task_role)
             | (.containerDefinitions[0].logConfiguration.options["awslogs-region"] = $region)
             | (.containerDefinitions[0].environment |= map(if .name == "CORS_ORIGINS" then .value = $cors_origins else . end))
             | (.volumes[0].efsVolumeConfiguration.fileSystemId = $efs_id)
             | (.volumes[0].efsVolumeConfiguration.authorizationConfig.accessPointId = $efs_access_point)
             | (.containerDefinitions[0].secrets[] |= if .name == "DATABASE_URL" then .valueFrom = $database_secret elif .name == "JWT_SECRET" then .valueFrom = $jwt_secret else . end)' \
            infra/ecs-task-definition.json > "$RUNNER_TEMP/task-definition.json"

      - uses: aws-actions/amazon-ecs-render-task-definition@v1
        id: task-def
        with:
          task-definition: ${{ runner.temp }}/task-definition.json
          container-name: sih-backend
          image: ${{ vars.ECR_REPOSITORY_URI }}:${{ github.sha }}
      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true

  deploy-frontend:
    name: Deploy frontend to Vercel
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Pull Vercel project settings
        working-directory: frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build for production
        working-directory: frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy production build
        working-directory: frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"