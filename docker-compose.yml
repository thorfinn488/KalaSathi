version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=kalasathi_prod_jwt_secret_key_change_in_production
      - DATABASE_URL=postgresql://kalasathi_user:kalasathi_secure_password@db:5432/kalasathi_db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kalasathi_user
      POSTGRES_PASSWORD: kalasathi_secure_password
      POSTGRES_DB: kalasathi_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kalasathi_user -d kalasathi_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
