<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="ksBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#241B35" />
      <stop offset="60%" stop-color="#14101E" />
      <stop offset="100%" stop-color="#0B0910" />
    </radialGradient>
    <linearGradient id="ksGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="ksCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171" />
      <stop offset="60%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <filter id="ksGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Badge -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#ksBg)" stroke="url(#ksGold)" stroke-width="2.5" />
  
  <!-- Subtle Ornamental Inner Filigree Ring -->
  <rect x="12" y="12" width="104" height="104" rx="22" fill="none" stroke="url(#ksGold)" stroke-width="0.75" stroke-dasharray="3,3" stroke-opacity="0.45" />

  <!-- Lotus & Craft Geometry -->
  <g transform="translate(64,64)" filter="url(#ksGlow)">
    <!-- 8-petal craft burst in background -->
    <g opacity="0.35" fill="none" stroke="url(#ksGold)" stroke-width="1.2">
      <path d="M 0,-44 C 10,-32 10,-24 0,-18 C -10,-24 -10,-32 0,-44 Z" />
      <path d="M 0,-44 C 10,-32 10,-24 0,-18 C -10,-24 -10,-32 0,-44 Z" transform="rotate(45)" />
      <path d="M 0,-44 C 10,-32 10,-24 0,-18 C -10,-24 -10,-32 0,-44 Z" transform="rotate(90)" />
      <path d="M 0,-44 C 10,-32 10,-24 0,-18 C -10,-24 -10,-32 0,-44 Z" transform="rotate(135)" />
      <path d="M 0,-44 C 10,-32 10,-24 0,-18 C -10,-24 -10,-32 0,-44 Z" transform="rotate(180)" />
      <path d="M 0,-44 C 10,-32 10,-24 0,-18 C -10,-24 -10,-32 0,-44 Z" transform="rotate(225)" />
      <path d="M 0,-44 C 10,-32 10,-24 0,-18 C -10,-24 -10,-32 0,-44 Z" transform="rotate(270)" />
      <path d="M 0,-44 C 10,-32 10,-24 0,-18 C -10,-24 -10,-32 0,-44 Z" transform="rotate(315)" />
    </g>

    <!-- Traditional Weaving Shuttle Motif Arc -->
    <path d="M -38,18 Q -46,-12 -28,-32 Q 0,-48 34,-32 Q 48,-16 38,16 Q 16,38 -14,38 Q -30,36 -38,18 Z" 
          fill="none" stroke="url(#ksCrimson)" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />

    <!-- Center Calligraphic Heritage Devanagari 'क' (KalaSathi Emblem) -->
    <!-- Shirorekha (Top Header Bar) -->
    <path d="M -26,-15 L 26,-15" stroke="url(#ksGold)" stroke-width="5.5" stroke-linecap="round" />
    
    <!-- Vertical Spine (Purna Stambha) -->
    <path d="M 0,-15 L 0,26" stroke="url(#ksGold)" stroke-width="5.5" stroke-linecap="round" />
    
    <!-- Left Loop (Kala Chakra) -->
    <path d="M 0,-4 C -18,-4 -18,14 0,14" fill="none" stroke="url(#ksGold)" stroke-width="5" stroke-linecap="round" />
    
    <!-- Right Tail / Shuttle Grace Curve -->
    <path d="M 0,-1 C 14,-1 22,6 20,20 C 18,27 10,27 8,24" fill="none" stroke="url(#ksGold)" stroke-width="4.5" stroke-linecap="round" />
    
    <!-- Central Jewel / Bindu (GI Heritage Mark) -->
    <circle cx="0" cy="-24" r="3.5" fill="url(#ksGold)" />
  </g>
</svg>